name: CI

on:
  workflow_dispatch:

jobs:

  Build_x64:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Sandboxie x86 (DLLs & svc)
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=Win32

      - name: Build Sandboxie x64 (drv)
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration="SbieRelease" /p:Platform=x64

      - uses: actions/upload-artifact@v7
        with:
          name: drv
          path: |
            Sandboxie/core/drv/Bin/*
